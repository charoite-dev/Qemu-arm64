name: Build QEMU for ARM64

on:
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  build:
    runs-on: ubuntu-24.04-arm  # Нативный ARM64 раннер

    steps:
      - name: Checkout QEMU source
        uses: actions/checkout@v4
        with:
          repository: qemu/qemu
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libglib2.0-dev \
            libpixman-1-dev \
            libepoxy-dev \
            libsdl2-dev \
            libgtk-3-dev \
            libvirglrenderer-dev

      - name: Configure QEMU
        run: |
          mkdir build
          cd build
          ../configure \
            --target-list=aarch64-softmmu \
            --enable-sdl \
            --enable-opengl \
            --enable-virglrenderer \
            --disable-werror

      - name: Build QEMU
        run: |
          cd build
          make -j$(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-aarch64
          path: build/qemu-system-aarch64
