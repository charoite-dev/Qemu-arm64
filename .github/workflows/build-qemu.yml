
name: Build Static QEMU 11.0.0 for AArch64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install toolchain and libs
        run: |
          sudo apt update
          sudo apt install -y \
            ninja-build pkg-config git build-essential python3-pip \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libglib2.0-dev libpixman-1-dev libepoxy-dev libsdl2-dev libvirglrenderer-dev

      - name: Checkout QEMU v11.0.0
        uses: actions/checkout@v4
        with:
          repository: qemu/qemu
          ref: v11.0.0
          fetch-depth: 1

      - name: Configure static build
        run: |
          mkdir -p build && cd build
          ../configure \
            --target-list=aarch64-softmmu \
            --cross-prefix=aarch64-linux-gnu- \
            --enable-sdl --enable-opengl --enable-virglrenderer --enable-vnc \
            --disable-kvm --static --disable-werror

      - name: Compile QEMU
        run: |
          cd build
          make -j$(nproc)

      - name: Inspect binary
        run: |
          file build/qemu-system-aarch64
          echo "Final size: $(du -h build/qemu-system-aarch64 | cut -f1)"
          strings build/qemu-system-aarch64 | grep -q "virgl" && echo "✅ VirGL linked"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: qemu-static-11.0.0-arm64
          path: build/qemu-system-aarch64
