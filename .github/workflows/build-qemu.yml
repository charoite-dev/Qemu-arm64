name: Build Static QEMU 11.0.0 for AArch64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Install base build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build \
          pkg-config \
          git \
          build-essential \
          python3-pip \
          python3-venv \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          libpixman-1-dev \
          libepoxy-dev \
          libsdl2-dev \
          libvirglrenderer-dev

    - name: Install modern meson
      run: |
        pip3 install --user meson
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Verify meson installation
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        meson --version

    - name: Build and install glib for ARM64 from source
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        wget https://download.gnome.org/sources/glib/2.82/glib-2.82.2.tar.xz
        tar -xf glib-2.82.2.tar.xz
        cd glib-2.82.2
        mkdir build && cd build
        meson setup .. \
          --cross-file /dev/null \
          --prefix=/usr/aarch64-linux-gnu \
          --libdir=lib \
          --default-library=both \
          -Dtests=false \
          -Dselinux=disabled \
          -Dlibmount=disabled
        ninja
        sudo ninja install

    - name: Checkout QEMU 11.0.0
      uses: actions/checkout@v4
      with:
        repository: qemu/qemu
        ref: v11.0.0
        fetch-depth: 1

    - name: Set up pkg-config environment
      run: |
        echo "PKG_CONFIG_PATH=/usr/aarch64-linux-gnu/lib/pkgconfig" >> $GITHUB_ENV
        echo "PKG_CONFIG_LIBDIR=/usr/aarch64-linux-gnu/lib/pkgconfig" >> $GITHUB_ENV

    - name: Configure QEMU (static build for ARM64)
      run: |
        mkdir -p build && cd build
        ../configure \
          --target-list=aarch64-softmmu \
          --cross-prefix=aarch64-linux-gnu- \
          --enable-sdl \
          --enable-opengl \
          --enable-virglrenderer \
          --enable-vnc \
          --disable-kvm \
          --static \
          --disable-werror

    - name: Build QEMU
      run: |
        cd build
        make -j$(nproc)

    - name: Verify binary
      run: |
        file build/qemu-system-aarch64
        strings build/qemu-system-aarch64 | grep -q "virgl" && echo "✅ VirGL enabled" || echo "⚠️ VirGL not found"

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: qemu-static-11.0.0-aarch64
        path: build/qemu-system-aarch64
